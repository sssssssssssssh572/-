<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D-Слайсер Клетки — Проект Шамиля</title>
    <style>
        body {
            margin: 0; padding: 0; overflow: hidden;
            background-color: #0b0e14;
            font-family: 'Segoe UI', system-ui, sans-serif;
            user-select: none; color: #cfd6df;
        }
        #main-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        #top-bar {
            position: absolute; top: 0; left: 0; right: 0;
            height: 50px; background: #181d28; border-bottom: 2px solid #00a3ff;
            display: flex; align-items: center; padding: 0 20px;
            justify-content: space-between; font-size: 14px; z-index: 10;
        }
        .brand { font-weight: bold; color: #00a3ff; }
        .author-badge { 
            background: #283146; padding: 6px 12px; border-radius: 20px; 
            font-size: 12px; color: #00ffaa; font-weight: bold; border: 1px solid #00ffaa;
        }
        #bio-inspect {
            position: absolute; top: 75px; left: 50%; transform: translateX(-50%);
            background: rgba(12, 16, 24, 0.9); border: 2px solid #00a3ff;
            padding: 12px 25px; border-radius: 15px; font-size: 14px;
            display: none; max-width: 450px; text-align: center; z-index: 10; color: #fff;
        }
        #layer-slider-container {
            position: absolute; right: 330px; top: 110px; bottom: 110px;
            width: 35px; display: flex; flex-direction: column; align-items: center;
            background: rgba(24, 29, 40, 0.8); border-radius: 6px; padding: 15px 0; border: 1px solid #283146; z-index: 10;
        }
        input[type="range"] { appearance: slider-vertical; width: 6px; height: 100%; background: #283146; cursor: pointer; }
        .layer-counter { font-size: 11px; color: #8892b0; margin-top: 8px; font-family: monospace; }
        #cura-panel {
            position: absolute; top: 75px; right: 20px;
            background: rgba(24, 29, 40, 0.95); border: 1px solid #283146; padding: 20px; border-radius: 6px; width: 280px; z-index: 10;
        }
        .panel-header { font-size: 12px; font-weight: bold; text-transform: uppercase; color: #00a3ff; margin-bottom: 12px; border-bottom: 1px solid #283146; padding-bottom: 6px; }
        .legend-item { display: flex; align-items: center; margin-bottom: 10px; font-size: 13px; }
        .color-box { width: 14px; height: 14px; border-radius: 3px; margin-right: 10px; }
    </style>
</head>
<body>

    <div id="top-bar">
        <div class="brand">Биология 7 класс: <span style="color:#fff; font-weight:normal;">Внутреннее строение клетки</span></div>
        <div class="author-badge">РАЗРАБОТАЛ: Шамиль, ученик 7 класса</div>
    </div>

    <div id="bio-inspect">Часть клетки: <span id="bio-text" style="color:#00a3ff; font-weight:bold;">-</span></div>

    <div id="main-container">
        <!-- Задали жесткие размеры, чтобы сцена гарантированно отрисовалась -->
        <svg id="svg-canvas" width="800" height="600" style="background:#0b0e14; overflow:visible;"></svg>
    </div>

    <div id="layer-slider-container">
        <input type="range" id="layer-slider" min="1" max="60" step="1" value="60">
        <div class="layer-counter" id="layer-display">60/60</div>
    </div>

    <div id="cura-panel">
        <div class="panel-header">Слои клетки (Вид изнутри)</div>
        <div class="legend-item"><div class="color-box" style="background:#00ff66;"></div><span>Мембрана (Оболочка)</span></div>
        <div class="legend-item"><div class="color-box" style="background:#ff3b30;"></div><span>Ядро</span></div>
        <div class="legend-item"><div class="color-box" style="background:#00a3ff;"></div><span>Вакуоли</span></div>
        <div class="legend-item"><div class="color-box" style="background:#4a5568;"></div><span>Цитоплазма (Среда клетки)</span></div>
    </div>

    <script>
        const svg = document.getElementById('svg-canvas');
        const slider = document.getElementById('layer-slider');
        const display = document.getElementById('layer-display');
        const bioInspect = document.getElementById('bio-inspect');
        const bioText = document.getElementById('bio-text');

        let angleY = 0;
        const TOTAL_LAYERS = 60;
        let layersData = [];

        function initData() {
            for (let l = 0; l < TOTAL_LAYERS; l++) {
                let h = (l - TOTAL_LAYERS/2) / (TOTAL_LAYERS/2);
                if (Math.abs(h) >= 0.98) continue;
                
                let baseRadius = Math.sqrt(1 - h * h) * 140;
                let layerY = h * 100;

                let layer = { y: layerY, index: l, elements: [] };

                // 1. Мембрана
                let memPoints = [];
                for (let i = 0; i <= 72; i++) {
                    let a = (i / 72) * Math.PI * 2;
                    let r = baseRadius + Math.sin(a * 5) * 8 * Math.cos(layerY*0.02);
                    memPoints.push({a: a, r: r});
                }
                layer.elements.push({ type: 'line', points: memPoints, color: '#00ff66', text: "КЛЕТОЧНАЯ МЕМБРАНА (Оболочка) — защищает клетку и отделяет цитоплазму от внешней среды." });

                // 2. Ядро
                let coreMax = 40;
                let distToCore = Math.abs(layerY - 10);
                if (distToCore < coreMax) {
                    let coreR = Math.sqrt(coreMax*coreMax - distToCore*distToCore);
                    let corePoints = [];
                    for (let i = 0; i <= 40; i++) {
                        let a = (i / 40) * Math.PI * 2;
                        corePoints.push({a: a, r: coreR, cx: -20, cz: -10});
                    }
                    layer.elements.push({ type: 'line', points: corePoints, color: '#ff3b30', text: "ЯДРО — главный центр, регулирует все процессы жизнедеятельности в цитоплазме." });
                }

                // 3. Вакуоли
                let vacs = [{x: 50, z: 30, r: 20}, {x: -40, z: 40, r: 16}];
                vacs.forEach(v => {
                    let distToVac = Math.abs(layerY);
                    if (distToVac < v.r) {
                        let vacR = Math.sqrt(v.r*v.r - distToVac*distToVac);
                        let vacPoints = [];
                        for (let i = 0; i <= 30; i++) {
                            let a = (i / 30) * Math.PI * 2;
                            vacPoints.push({a: a, r: vacR, cx: v.x, cz: v.z});
                        }
                        layer.elements.push({ type: 'line', points: vacPoints, color: '#00a3ff', text: "ВНУТРЕННЯЯ ВАКУОЛЬ — находится в цитоплазме, содержит запас воды и клеточного сока." });
                    }
                });

                // 4. Цитоплазма (Внутренние линии)
                let gridLines = [];
                let space = 16;
                for (let x = -baseRadius; x <= baseRadius; x += space) {
                    for (let z = -baseRadius; z <= baseRadius; z += space) {
                        let d = Math.sqrt(x*x + z*z);
                        if (d < baseRadius - 4) {
                            let dToCore = Math.sqrt((x+20)*(x+20) + (z+10)*(z+10));
                            if (dToCore > 30 || distToCore >= coreMax) {
                                if (l % 2 === 0) {
                                    gridLines.push({x1: x, z1: z - space/2, x2: x, z2: z + space/2});
                                } else {
                                    gridLines.push({x1: x - space/2, z1: z, x2: x + space/2, z2: z});
                                }
                            }
                        }
                    }
                }
                if (gridLines.length > 0) {
                    layer.elements.push({ type: 'grid', lines: gridLines, color: '#4a5568', text: "ЦИТОПЛАЗМА — основное вязкое вещество клетки, в котором располагаются все остальные органоиды." });
                }

                layersData.push(layer);
            }
        }

        function project(x, y, z) {
            let cos = Math.cos(angleY);
            let sin = Math.sin(angleY);
            let rx = x * cos - z * sin;
            let rz = x * sin + z * cos;
            
            // Центрируем внутри контейнера 800x600
            let screenX = 400 + rx * 1.6;
            let screenY = 300 + (rz * 0.4 - y * 1.3);
            return { x: screenX, y: screenY };
        }

        function render() {
            svg.innerHTML = '';
            let maxVisible = parseInt(slider.value);
            display.innerText = maxVisible + '/60';

            layersData.forEach((layer, idx) => {
                if (idx >= maxVisible) return;

                layer.elements.forEach(el => {
                    if (el.type === 'line') {
                        let dStr = '';
                        el.points.forEach((p, pIdx) => {
                            let cx = p.cx || 0;
                            let cz = p.cz || 0;
                            let lx = cx + Math.cos(p.a) * p.r;
                            let lz = cz + Math.sin(p.a) * p.r;
                            let pt = project(lx, layer.y, lz);
                            dStr += (pIdx === 0 ? 'M ' : 'L ') + pt.x + ' ' + pt.y;
                        });

                        let path = document.createElementNS("http://w3.org", "path");
                        path.setAttribute("d", dStr);
                        path.setAttribute("stroke", el.color);
                        path.setAttribute("stroke-width", "2.5");
                        path.setAttribute("fill", "none");
                        
                        path.addEventListener('mouseover', () => {
