    <script>
        // --- 1. Настройка 3D графики ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0b0e14);

        const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(4, 5, 7);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // Стол принтера (Сетка)
        const grid = new THREE.GridHelper(6, 20, 0x283146, 0x181d28);
        grid.position.y = -1.6;
        scene.add(grid);

        const cellGroup = new THREE.Group();
        scene.add(cellGroup);

        const TOTAL_LAYERS = 100;
        const minY = -1.4, maxY = 1.4;
        const stepY = (maxY - minY) / TOTAL_LAYERS;
        
        let layerObjects = [];
        let raycastTargets = [];
        let autoRotate = true;
        let isPlaying = false;
        let playInterval = null;

        // Функция шума для неровности живой клетки
        function getBioNoise(angle, y, freq, amp) {
            return Math.sin(angle * freq + y * 2) * Math.cos(angle * 2 - y) * amp;
        }

        // Функция создания путей линий G-Code
        function createGCodePath(points, color, opacity = 1, infoText = "") {
            const geo = new THREE.BufferGeometry().setFromPoints(points);
            const mat = new THREE.LineBasicMaterial({ 
                color: color, transparent: opacity < 1, opacity: opacity, linewidth: 2 
            });
            const line = new THREE.Line(geo, mat);
            line.userData = { structure: infoText }; 
            return line;
        }

        // --- 2. ГЕНЕРАТОР СЛОЕВ КЛЕТКИ (Программа 5-7 класса) ---
        function generateCellLayers() {
            for (let l = 0; l < TOTAL_LAYERS; l++) {
                const currentY = minY + l * stepY;
                const layerGroup = new THREE.Group();
                const segments = 90;

                const h = currentY / 1.4;
                if (Math.abs(h) >= 1.0) continue;
